<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Caneca Inspiração 365</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(#fff8ed, #ffffff);
    color: #4b3525;
    text-align: center;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

.imagem {
    width: 100%;
    border-radius: 20px;
    margin-top: 20px;
}

h1 {
    font-size: 28px;
}

.mensagem {
    font-size: 18px;
    line-height: 1.7;
    background: white;
    padding: 20px;
    border-radius: 20px;
}

.botao {
    display: inline-block;
    margin-top: 20px;
    padding: 15px 30px;
    background: #8b5e34;
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-size: 18px;
}

.rodape {
    margin-top: 30px;
    font-size: 14px;
}

</style>

</head>

<body>

<div class="container">

<h1>✨ Sua mensagem de hoje ✨</h1>

<img id="imagemDia" class="imagem" src="" alt="Imagem inspiradora">

<h2 id="tituloDia"></h2>

<div class="mensagem" id="mensagemDia">
Carregando sua inspiração...
</div>

<a id="musicaDia" class="botao" target="_blank">
🎵 Ouvir música do dia
</a>

<div class="rodape">
❤️ Caneca Inspiração 365<br>
Click Variedades Promo
</div>

</div>


<script src="dados.js"></script>
<script src="script.js"></script>

</body>
</html>
